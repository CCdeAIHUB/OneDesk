syntax = "proto3";

package onedesk.v1;

option csharp_namespace = "OneDesk.Protocol";
option java_package = "cc.onedesk.protocol";
option java_multiple_files = true;
option swift_prefix = "OD";

message DeviceIdentity {
  string device_id = 1;
  string display_name = 2;
  DeviceKind kind = 3;
  string platform = 4;
  string architecture = 5;
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_DESKTOP = 1;
  DEVICE_KIND_MOBILE = 2;
}

message PairingRequest {
  string verification_code = 1;
  string client_nonce = 2;
  DeviceIdentity mobile_identity = 3;
}

message PairingResponse {
  DeviceIdentity desktop_identity = 1;
  DeviceIdentity assigned_mobile_identity = 2;
  string trust_credential = 3;
  int64 credential_expires_at_unix_ms = 4;
}

message TrustedConnectRequest {
  string trust_credential = 1;
  string client_nonce = 2;
  DeviceIdentity mobile_identity = 3;
}

message JsApiRequest {
  string request_id = 1;
  string target_device_id = 2;
  TrustedSource source = 3;
  string capability = 4;
  bytes json_payload = 5;
}

message TrustedSource {
  string scheme_id = 1;
  string page_id = 2;
  string component_id = 3;
  string plugin_id = 4;
  SourceKind kind = 5;
}

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_COMPONENT = 1;
  SOURCE_KIND_PLUGIN = 2;
  SOURCE_KIND_SYSTEM = 3;
}

message JsApiResponse {
  string request_id = 1;
  bool ok = 2;
  JsApiError error = 3;
  bytes json_payload = 4;
}

message JsApiError {
  string code = 1;
  string message = 2;
  bool high_risk = 3;
}

message SchemeManifest {
  string scheme_id = 1;
  string version = 2;
  string content_hash = 3;
  repeated string page_ids = 4;
  repeated Dependency dependencies = 5;
}

message Dependency {
  string id = 1;
  string version = 2;
  DependencyKind kind = 3;
}

enum DependencyKind {
  DEPENDENCY_KIND_UNSPECIFIED = 0;
  DEPENDENCY_KIND_PLUGIN = 1;
  DEPENDENCY_KIND_COMPONENT = 2;
  DEPENDENCY_KIND_ACTION = 3;
}

message LogRecord {
  string log_id = 1;
  int64 created_at_unix_ms = 2;
  string source_device_id = 3;
  string level = 4;
  string category = 5;
  string message = 6;
  bytes json_context = 7;
}
