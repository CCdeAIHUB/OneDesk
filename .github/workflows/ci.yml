name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-and-desktop:
    name: Frontend and desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build protocol and Vue frontends
        run: pnpm build
      - name: Build desktop shell
        run: dotnet build apps/desktop/OneDesk.Desktop.csproj --configuration Release
      - name: Build Windows Chromium desktop app
        run: dotnet build apps/desktop-windows/OneDesk.Windows.csproj --configuration Release

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.4.1
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build mobile frontend
        run: pnpm --filter @onedesk/mobile-ui build
      - name: Build Android shell
        working-directory: apps/mobile/android
        run: gradle :app:assembleDebug --no-daemon
