name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-15
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onedesk/protocol build
      - run: pnpm --filter @onedesk/desktop-ui build
      - name: Publish desktop shell
        run: dotnet publish apps/desktop/OneDesk.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }} -p:PublishSingleFile=false
      - name: Package desktop artifact
        shell: pwsh
        run: Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "artifacts/OneDesk-${{ matrix.rid }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OneDesk-${{ matrix.rid }}
          path: artifacts/OneDesk-${{ matrix.rid }}.zip
          if-no-files-found: error

  android:
    name: Android arm64-v8a and x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - run: pnpm install --frozen-lockfile
      - name: Build Android installable APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OneDesk-android
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - run: brew install cmake ninja
      - run: pnpm install --frozen-lockfile
      - name: Build iOS shell without signing
        run: >-
          xcodebuild
          -project apps/mobile/ios/OneDesk.xcodeproj
          -scheme OneDesk
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath artifacts/ios-derived
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package iOS simulator application
        run: ditto -c -k --sequesterRsrc --keepParent artifacts/ios-derived/Build/Products/Release-iphonesimulator/OneDesk.app artifacts/OneDesk-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OneDesk-ios-simulator
          path: artifacts/OneDesk-ios-simulator.zip
          if-no-files-found: error
