plugins {
    id "com.android.application"
}

android {
    namespace "cc.onedesk.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "cc.onedesk.mobile"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += file("../../../../frontends/mobile/dist")
        }
    }
}

dependencies {
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.camera:camera-core:1.6.1"
    implementation "androidx.camera:camera-camera2:1.6.1"
    implementation "androidx.camera:camera-lifecycle:1.6.1"
    implementation "androidx.camera:camera-view:1.6.1"
    implementation "com.google.zxing:core:3.5.4"
}

def mobileFrontendDir = file("../../../../frontends/mobile")
def pnpmCommand = System.getProperty("os.name").toLowerCase().contains("windows") ? "pnpm.cmd" : "pnpm"

tasks.register("buildMobileFrontend", Exec) {
    workingDir mobileFrontendDir
    commandLine pnpmCommand, "build"
    inputs.files(fileTree(mobileFrontendDir) {
        include "src/**"
        include "index.html"
        include "vite.config.ts"
        include "package.json"
        include "tsconfig*.json"
    })
    outputs.dir(file("${mobileFrontendDir}/dist"))
}

tasks.named("preBuild").configure {
    dependsOn("buildMobileFrontend")
}
